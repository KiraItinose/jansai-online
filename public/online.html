<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08232c"><title>オンライン対戦｜雀彩</title><link rel="stylesheet" href="online.css"></head><body>
<main id="lobby"><img class="logo" src="branding/jansai-logo.png" alt="雀彩"><h1>オンライン対戦</h1><p id="status" role="status">接続を準備しています…</p><div id="codeRow" hidden><span>卓コード</span><strong id="code"></strong><label id="inviteLabel" for="inviteUrl">友人に送る招待URL（選択して手動コピーもできます）</label><input id="inviteUrl" type="text" readonly spellcheck="false" autocomplete="off" aria-label="友人に送る招待URL"><button id="copy" type="button">招待URLをコピー</button><p id="copyStatus" role="status" aria-live="polite"></p><small id="inviteHelp">このURLを友人に送ってください。ホストが待機中の卓に参加できます（対局開始後は新規参加できません）。</small></div><div id="players" aria-live="polite"></div><p id="rules"></p><button id="start" hidden>空席をCPUにして開始</button><button id="retry" hidden>再接続</button><button id="back">TOPへ戻る</button><p class="note">2〜4人で対戦できます。空席はCPUが参加します。<br>端末間の直接通信ではなく、CloudflareのWebSocketで対局を同期します。<br>現在は<strong>ホストの端末で麻雀ルールの計算</strong>をしています。ホストが画面を閉じると対局を継続できません。<br>参加者の切断は再接続可能です。1卓の対局途中の完全な再開機能は今後の課題です。</p></main>
<div id="bar" hidden><span id="connection" role="status"></span><button id="fullscreen">全画面</button><button id="exit">退室</button></div><iframe id="table" title="雀彩 オンライン対局" allow="fullscreen" hidden></iframe>
<script src="online.js"></script></body></html>
